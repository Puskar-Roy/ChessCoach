<!doctype html>
<html lang="en" data-theme="dark" class="picker-page no-material">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>Select your board</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html.picker-page, .picker-page body { background: #000; color: #fff; }
    #stage { position: fixed; inset: 0; overflow: hidden; }
    #shot { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
    #mask { position: absolute; inset: 0; width: 100%; height: 100%; }
    #frame { position: absolute; border-radius: 6px; box-shadow: 0 0 0 3px var(--blue), 0 0 40px rgba(10, 132, 255, 0.55); pointer-events: none; will-change: transform, width, height; }
    .handle { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5), 0 0 0 2px var(--blue); }
    #hud { position: fixed; top: 28px; left: 50%; transform: translateX(-50%); min-width: 420px; max-width: 560px; padding: 16px 20px; border-radius: 22px; text-align: center;
      background: rgba(40, 40, 44, 0.78); backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55); will-change: transform, opacity; }
    #hud .title-2 { margin-bottom: 3px; }
    #hud .row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
    .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, 0.25); border-top-color: #fff; animation: spin 0.9s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
    .big-check { width: 46px; height: 46px; border-radius: 50%; background: var(--green); display: grid; place-items: center; margin: 0 auto 10px; color: #fff; }
    .big-check svg { width: 26px; height: 26px; }
    .hint-keys { margin-top: 10px; font-size: 12px; color: rgba(235, 235, 245, 0.6); }
    #editor { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px); }
    #editor.open { display: grid; }
    .editor-card { width: min(1020px, calc(100vw - 48px)); max-height: calc(100vh - 48px); overflow: auto; padding: 22px 24px 20px; border-radius: 24px; background: rgba(38, 38, 42, 0.92); border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
    .editor-cols { display: grid; grid-template-columns: 1fr 340px; gap: 22px; margin-top: 16px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; align-content: start; }
    .tile { padding: 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.1); }
    .tile.todo { box-shadow: inset 0 0 0 1.5px var(--orange); }
    .tile .shot { position: relative; width: 84px; height: 84px; margin: 0 auto 8px; border-radius: 10px; overflow: hidden; }
    .tile .shot img { width: 84px; height: 84px; display: block; }
    .tile .shot b { position: absolute; right: 4px; bottom: 4px; padding: 1px 7px; border-radius: 9px; font-size: 11px; background: rgba(0, 0, 0, 0.7); }
    .kinds { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
    .kinds button { height: 28px; min-width: 0; border-radius: 8px; background: rgba(255, 255, 255, 0.07); display: grid; place-items: center; }
    .kinds button svg { width: 21px; height: 21px; }
    .kinds button[aria-pressed="true"] { background: var(--blue); }
    .kinds button:active { transform: scale(0.94); transition: transform 100ms ease-out; }
    .mini { position: relative; width: 320px; height: 320px; border-radius: 8px; overflow: hidden; background: repeating-conic-gradient(#769656 0 25%, #eeeed2 0 50%); background-size: 25% 25%; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4); }
    .mini .p { position: absolute; width: 40px; height: 40px; }
    .mini .p svg { width: 100%; height: 100%; }
    .mini .unk { position: absolute; width: 40px; height: 40px; display: grid; place-items: center; font: 700 16px var(--font); }
    kbd { font: 600 11px var(--font); padding: 1px 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.14); }
  </style>
</head>
<body>
  <div id="stage">
    <img id="shot" alt="">
    <svg id="mask"></svg>
    <div id="frame" hidden></div>
  </div>
  <div id="hud"></div>
  <div id="editor"></div>
  <script type="module" src="js/picker.js"></script>
</body>
</html>
