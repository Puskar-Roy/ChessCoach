name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install desktop dependencies
        run: npm --prefix app ci
      - name: Install Stockfish
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'stockfish.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'stockfish'
          Invoke-WebRequest 'https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-windows-x86-64-sse41-popcnt.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $directory
          $engine = Get-ChildItem $directory -Filter 'stockfish*.exe' -File -Recurse | Select-Object -First 1
          if (-not $engine) { throw 'Stockfish executable not found' }
          "STOCKFISH_PATH=$($engine.FullName)" >> $env:GITHUB_ENV
      - name: Run Python tests
        run: python -m pytest -q
